name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install -g npm@latest
      - run: npm test
      - name: Publish unpublished package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          ver="$(node -p "require('./package.json').version")"
          if npm view "${name}@${ver}" version >/dev/null 2>&1; then
            echo "${name}@${ver} already on npm, skip"
            exit 0
          fi
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            unset NODE_AUTH_TOKEN NPM_TOKEN || true
            if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "${NPM_CONFIG_USERCONFIG}" ]; then
              sed -i '/_authToken/d; /always-auth/d' "${NPM_CONFIG_USERCONFIG}"
            fi
          fi
          echo "Publishing ${name}@${ver}"
          npm publish --access public --ignore-scripts

      - name: Trigger sveda SDK compatibility matrix
        if: ${{ secrets.SVEDA_REPO_DISPATCH_TOKEN != '' }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SVEDA_REPO_DISPATCH_TOKEN }}
          repository: neresson/sveda
          event-type: sdk-release
          client-payload: '{"sdk":"node","version":"${{ github.ref_name }}"}'
