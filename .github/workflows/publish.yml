name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Do not set registry-url: setup-node would write always-auth and a dummy
      # NODE_AUTH_TOKEN, which makes npm skip OIDC trusted publishing and PUT 404.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g npm@latest
      - run: npm test
      - name: Publish unpublished package
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "${NPM_CONFIG_USERCONFIG}" ]; then
            sed -i '/_authToken/d; /always-auth/d' "${NPM_CONFIG_USERCONFIG}"
          fi
          name="$(node -p "require('./package.json').name")"
          ver="$(node -p "require('./package.json').version")"
          if npm view "${name}@${ver}" version >/dev/null 2>&1; then
            echo "${name}@${ver} already on npm, skip"
            exit 0
          fi
          echo "Publishing ${name}@${ver}"
          npm publish --access public --ignore-scripts
